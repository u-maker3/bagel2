<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ベーグル積めるんかい。</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fff1dc;color:#432d25;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:540px;margin:auto;padding:12px}.screen{display:none}.on{display:block}.card{background:#fff;border:2px solid #efd6b6;border-radius:25px;padding:18px;text-align:center}.title{font-size:38px;font-weight:1000;color:#854325;line-height:1.05}.sub{font-weight:900;font-size:18px;margin:8px}.card img{width:min(70vw,300px);max-height:320px;object-fit:contain}.btn{border:0;border-radius:999px;background:#ff6687;color:white;font-weight:1000;font-size:20px;padding:14px 26px;box-shadow:0 6px 0 #d34b68}.btn:disabled{opacity:.45}.how{text-align:left;background:#fff8ef;border-radius:16px;padding:12px;margin-top:15px;font-size:13px;line-height:1.6}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}.stat{background:#fff;border:2px solid #efd6b6;border-radius:14px;text-align:center;font-weight:900;padding:6px}.stat b{display:block;font-size:21px}
#box{position:relative;height:min(75vh,680px);min-height:520px;overflow:hidden;border:3px solid #c88b58;border-radius:22px;background:linear-gradient(#fff7df 0 73%,#d9a56f 73% 76%,#f1c990 76%);touch-action:none}#hint{position:absolute;top:7px;left:50%;transform:translateX(-50%);background:white;border:2px solid #8a5332;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:1000;white-space:nowrap}
#dropper{position:absolute;top:45px;left:50%;width:88px;height:88px;transform:translateX(-50%);z-index:20;pointer-events:none}#dropper img{width:100%;height:100%;object-fit:contain}.guide{position:absolute;top:128px;bottom:135px;border-left:2px dashed #b99a7c;opacity:.45}.tower{position:absolute;inset:0 0 115px;pointer-events:none}.piece{position:absolute;width:92px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 2px #79502d66);transform-origin:center}.platform{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);width:150px;height:15px;border-radius:50%;background:#a9663d;box-shadow:0 5px #754327}.umeko{position:absolute;right:-3px;bottom:0;width:128px;z-index:8}.bubble{position:absolute;right:90px;bottom:94px;z-index:9;background:white;border:2px solid #8a5332;border-radius:14px;padding:5px 8px;font-size:12px;font-weight:1000;white-space:nowrap}.danger{display:none;position:absolute;inset:0;border:7px solid #df454599;pointer-events:none;animation:d .4s infinite alternate}@keyframes d{to{opacity:.3;border-width:2px}}
.controls{position:absolute;left:8px;right:8px;bottom:10px;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;z-index:30}.ctrl{border:0;border-radius:14px;padding:13px 4px;font-size:20px;font-weight:1000;color:white;background:#8a5332}.drop{background:#e9516d}.toast{position:absolute;top:145px;left:50%;transform:translateX(-50%);z-index:50;background:#432d25ee;color:white;border-radius:99px;padding:7px 12px;font-weight:1000;opacity:0;white-space:nowrap}.big{font-size:42px;font-weight:1000;color:#aa552b}.msg{font-size:19px;font-weight:1000;line-height:1.5;margin:10px}
</style></head><body><main class="app">
<section id="start" class="screen on"><div class="card"><div class="title">🥯 ベーグル<br>積めるんかい。</div><div class="sub">〜買えたからって安心すな〜</div><img src="./umeko_stack.PNG"><p><b>買えた。そこまではええ。<br>今度は落とさんと積め🤣</b></p><button id="startBtn" class="btn">積み始める</button><div class="how"><b>遊び方</b><br>左右で位置を決めて「落とす‼️」。ズレすぎるほど安定度が減るで。<br>🧀チーズは滑る／🫐ブルーベリーは弾む／🍫チョコは重い／✨激レアは100点やけど不安定。</div></div></section>
<section id="game" class="screen"><div class="hud"><div class="stat">高さ<b id="num">0</b></div><div class="stat">SCORE<b id="score">0</b></div><div class="stat">安定度<b id="stable">100%</b></div></div><div id="box"><div id="hint">左右で動かして、落とせ🥯</div><div id="guide" class="guide"></div><div id="dropper"><img id="next"></div><div id="tower" class="tower"></div><div class="platform"></div><img id="umeko" class="umeko" src="./umeko_stack.PNG"><div id="bubble" class="bubble">来い来い来い‼️</div><div id="danger" class="danger"></div><div id="toast" class="toast"></div><div class="controls"><button id="left" class="ctrl">←</button><button id="drop" class="ctrl drop">落とす‼️</button><button id="right" class="ctrl">→</button></div></div></section>
<section id="result" class="screen"><div class="card"><h1 id="rtitle">崩壊💥</h1><img id="rimg" src="./umeko_stack_shake.PNG"><div class="big"><span id="final">0</span>点</div><div id="msg" class="msg"></div><button id="retry" class="btn">もう一回積む</button></div></section>
</main><script>
(()=>{const $=q=>document.querySelector(q),box=$("#box"),tower=$("#tower"),dropper=$("#dropper");
const T=[["plain","./bagel_plain.PNG",10,0,0,0,42],["cheese","./bagel_cheese.PNG",20,12,0,0,22],["choco","./bagel_choco.PNG",30,0,0,7,15],["blueberry","./bagel_blueberry.PNG",30,0,11,0,15],["rare","./bagel_rare.PNG",100,15,8,5,6]];
let play=false,x=0,score=0,n=0,stable=100,cur=null,last=null,pieces=[],timer;
function screen(id){document.querySelectorAll(".screen").forEach(e=>e.classList.remove("on"));$("#"+id).classList.add("on")}
function pick(){let r=Math.random()*100,a=0;for(const t of T){a+=t[6];if(r<a)return t}return T[0]}
function setX(v){x=Math.max(43,Math.min(box.clientWidth-43,v));dropper.style.left=x+"px";$("#guide").style.left=x+"px"}
function prep(){cur=pick();$("#next").src=cur[1];setX(box.clientWidth/2)}
function update(){$("#num").textContent=n;$("#score").textContent=score;$("#stable").textContent=Math.max(0,Math.round(stable))+"%";let bad=n>=6||stable<55;$("#umeko").src=bad?"./umeko_stack_shake.PNG":"./umeko_stack.PNG";$("#bubble").textContent=bad?"ちょ待てプルプルする‼️":"来い来い来い‼️";$("#danger").style.display=bad?"block":"none"}
function toast(t){let e=$("#toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,700)}
function start(){play=true;score=0;n=0;stable=100;last=null;pieces=[];tower.innerHTML="";screen("game");update();setTimeout(prep,30)}
function drop(){if(!play||!cur)return;let target=last===null?box.clientWidth/2:last,dx=x-target;if(cur[3])dx+=(Math.random()-.5)*cur[3]*2;if(cur[4])dx+=(Math.random()-.5)*cur[4]*2;let a=Math.abs(dx);if(a>58)return collapse("横にズレすぎや‼️");let settled=x+(cur[3]?(Math.random()-.5)*cur[3]:0),p=document.createElement("img");p.src=cur[1];p.className="piece";p.style.left=(settled-46)+"px";p.style.bottom=(n*43)+"px";p.style.transform="rotate("+Math.max(-13,Math.min(13,dx*.16))+"deg)";tower.appendChild(p);pieces.push(p);stable-=a*.58+cur[5]+(cur[0]=="rare"?7:0);score+=cur[2]+Math.max(0,Math.round(30-a/2));n++;last=settled;if(cur[0]=="cheese")toast("🧀 ツルッ…");if(cur[0]=="blueberry")toast("🫐 ボヨンッ");if(cur[0]=="choco")toast("🍫 重っ");if(cur[0]=="rare")toast("✨ 激レア +100");update();if(stable<=0)return setTimeout(()=>collapse("耐えられるかい‼️"),150);cur=null;setTimeout(prep,210)}
function collapse(reason){if(!play)return;play=false;cur=null;pieces.forEach((p,i)=>{p.style.transition="all .65s";p.style.transform="translate("+(i%2?1:-1)*(70+i*8)+"px,90px) rotate("+(i%2?1:-1)*(40+i*6)+"deg)";p.style.opacity=".25"});$("#bubble").textContent="あーーーー‼️";setTimeout(()=>finish(reason),700)}
function finish(reason){$("#final").textContent=score;let m,img="./umeko_stack_shake.PNG",title="崩壊💥";if(score<250)m="それ積んだ言わん。置いただけや。";else if(score<500)m="まあ……ベーグルは数個守った。";else if(score<800)m="お、よう耐えた。まだ修行中やけどな。";else if(score<1200){m="かなり積んだやん。認めたる。";img="./umeko_stack.PNG";title="生還🥯"}else{m="店の棚より積んでへんか？";img="./umeko_stack.PNG";title="積み職人👑"}$("#rtitle").textContent=title;$("#rimg").src=img;$("#msg").innerHTML=reason+"<br>"+m;screen("result");$("#retry").disabled=true;setTimeout(()=>$("#retry").disabled=false,900)}
function move(d){if(play&&cur)setX(x+d*18)}$("#left").onpointerdown=e=>{e.preventDefault();move(-1);clearInterval(timer);timer=setInterval(()=>move(-1),80)};$("#right").onpointerdown=e=>{e.preventDefault();move(1);clearInterval(timer);timer=setInterval(()=>move(1),80)};document.addEventListener("pointerup",()=>clearInterval(timer));document.addEventListener("pointercancel",()=>clearInterval(timer));$("#drop").onpointerdown=e=>{e.preventDefault();drop()};$("#startBtn").onclick=start;$("#retry").onclick=()=>{if(!$("#retry").disabled)start()};
})();</script></body></html>
