<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ベーグル積めるんかい。</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fff1dc;color:#432d25;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:540px;margin:auto;padding:12px}.screen{display:none}.on{display:block}.card{background:#fff;border:2px solid #efd6b6;border-radius:25px;padding:18px;text-align:center}.title{font-size:38px;font-weight:1000;color:#854325;line-height:1.05}.sub{font-weight:900;font-size:18px;margin:8px}.card img{width:min(70vw,300px);max-height:320px;object-fit:contain}.btn{border:0;border-radius:999px;background:#ff6687;color:white;font-weight:1000;font-size:20px;padding:14px 26px;box-shadow:0 6px 0 #d34b68}.btn:disabled{opacity:.45}.how{text-align:left;background:#fff8ef;border-radius:16px;padding:12px;margin-top:15px;font-size:13px;line-height:1.6}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}.stat{background:#fff;border:2px solid #efd6b6;border-radius:14px;text-align:center;font-weight:900;padding:6px}.stat b{display:block;font-size:21px}
#box{position:relative;height:min(75vh,680px);min-height:520px;overflow:hidden;border:3px solid #c88b58;border-radius:22px;background:linear-gradient(#fff7df 0 73%,#d9a56f 73% 76%,#f1c990 76%);touch-action:none}#hint{position:absolute;top:7px;left:50%;transform:translateX(-50%);background:white;border:2px solid #8a5332;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:1000;white-space:nowrap}
#dropper{position:absolute;top:45px;left:50%;width:88px;height:88px;transform:translateX(-50%);z-index:20;pointer-events:none}#dropper img{width:100%;height:100%;object-fit:contain}.guide{position:absolute;top:128px;bottom:135px;border-left:2px dashed #b99a7c;opacity:.45}.tower{position:absolute;inset:0 0 115px;pointer-events:none}.piece{position:absolute;width:92px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 2px #79502d66);transform-origin:center}.platform{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);width:150px;height:15px;border-radius:50%;background:#a9663d;box-shadow:0 5px #754327}.umeko{position:absolute;right:-3px;bottom:0;width:128px;z-index:8}.bubble{position:absolute;right:90px;bottom:94px;z-index:9;background:white;border:2px solid #8a5332;border-radius:14px;padding:5px 8px;font-size:12px;font-weight:1000;white-space:nowrap}.danger{display:none;position:absolute;inset:0;border:7px solid #df454599;pointer-events:none;animation:d .4s infinite alternate}@keyframes d{to{opacity:.3;border-width:2px}}
.controls{position:absolute;left:8px;right:8px;bottom:10px;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;z-index:30}.ctrl{border:0;border-radius:14px;padding:13px 4px;font-size:20px;font-weight:1000;color:white;background:#8a5332}.drop{background:#e9516d}.toast{position:absolute;top:145px;left:50%;transform:translateX(-50%);z-index:50;background:#432d25ee;color:white;border-radius:99px;padding:7px 12px;font-weight:1000;opacity:0;white-space:nowrap}.big{font-size:42px;font-weight:1000;color:#aa552b}.msg{font-size:19px;font-weight:1000;line-height:1.5;margin:10px}
</style></head><body><main class="app">
<section id="start" class="screen on"><div class="card"><div class="title">🥯 ベーグル<br>積めるんかい。</div><div class="sub">〜買えたからって安心すな〜</div><img src="./umeko_stack.PNG"><p><b>買えた。そこまではええ。<br>今度は落とさんと積め🤣</b></p><button id="startBtn" class="btn">積み始める</button><div class="how"><b>遊び方</b><br>左右どこでも落とせるで。横に並べて土台を作って、2個のベーグルにまたがせればピラミッド積みもOK🥯<br>空中に落としたら失敗。高くなると自動で縮小して、まだまだ積める。</div></div></section>
<section id="game" class="screen"><div class="hud"><div class="stat">高さ<b id="num">0</b></div><div class="stat">SCORE<b id="score">0</b></div><div class="stat">安定度<b id="stable">100%</b></div></div><div id="box"><div id="hint">左右で動かして、落とせ🥯</div><div id="guide" class="guide"></div><div id="dropper"><img id="next"></div><div id="tower" class="tower"></div><div class="platform"></div><img id="umeko" class="umeko" src="./umeko_stack.PNG"><div id="bubble" class="bubble">来い来い来い‼️</div><div id="danger" class="danger"></div><div id="toast" class="toast"></div><div class="controls"><button id="left" class="ctrl">←</button><button id="drop" class="ctrl drop">落とす‼️</button><button id="right" class="ctrl">→</button></div></div></section>
<section id="result" class="screen"><div class="card"><h1 id="rtitle">崩壊💥</h1><img id="rimg" src="./umeko_stack_shake.PNG"><div class="big"><span id="final">0</span>点</div><div id="msg" class="msg"></div><button id="retry" class="btn">もう一回積む</button></div></section>
</main><script>
(()=>{
const $=q=>document.querySelector(q), box=$("#box"), tower=$("#tower"), dropper=$("#dropper");
const T=[
 ["plain","./bagel_plain.PNG",10,0,42],
 ["cheese","./bagel_cheese.PNG",20,7,22],
 ["choco","./bagel_choco.PNG",30,3,15],
 ["blueberry","./bagel_blueberry.PNG",30,5,15],
 ["rare","./bagel_rare.PNG",100,9,6]
];
const PW=92, PH=48, BASE_Y=0;
let play=false,x=0,score=0,n=0,stable=100,cur=null,pieces=[],timer=null;

function screen(id){document.querySelectorAll(".screen").forEach(e=>e.classList.remove("on"));$("#"+id).classList.add("on")}
function pick(){let r=Math.random()*100,a=0;for(const t of T){a+=t[4];if(r<a)return t}return T[0]}
function setX(v){x=Math.max(PW/2,Math.min(box.clientWidth-PW/2,v));dropper.style.left=x+"px";$("#guide").style.left=x+"px"}
function prep(){if(!play)return;cur=pick();$("#next").src=cur[1];setX(box.clientWidth/2)}
function toast(t){let e=$("#toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,760)}
function update(){
 $("#num").textContent=n;$("#score").textContent=score;$("#stable").textContent=Math.max(0,Math.round(stable))+"%";
 let bad=n>=10||stable<55;
 $("#umeko").src=bad?"./umeko_stack_shake.PNG":"./umeko_stack.PNG";
 $("#bubble").textContent=n>=30?"もうパン屋やれ‼️":n>=20?"まだ積むんかい‼️":bad?"ちょ待てプルプルする‼️":"来い来い来い‼️";
 $("#danger").style.display=bad?"block":"none";
}
function start(){play=true;score=0;n=0;stable=100;cur=null;pieces=[];tower.innerHTML="";screen("game");update();setTimeout(prep,40)}

function overlap(a,b){
 return Math.max(0, Math.min(a.x+PW/2,b.x+PW/2)-Math.max(a.x-PW/2,b.x-PW/2));
}
function findLanding(cx){
 // Ground if no supporting pieces under x.
 let candidates=pieces.filter(p=>overlap({x:cx},p)>12).sort((a,b)=>b.y-a.y);
 if(!candidates.length) return {y:BASE_Y,support:[],coverage:1};

 // Find highest surface(s) intersecting the new bagel.
 let topY=candidates[0].y+PH;
 let near=candidates.filter(p=>Math.abs((p.y+PH)-topY)<8 && overlap({x:cx},p)>12);
 let coverage=0;
 near.forEach(p=>coverage+=overlap({x:cx},p));
 coverage=Math.min(1,coverage/PW);
 return {y:topY,support:near,coverage};
}
function drop(){
 if(!play||!cur)return;
 let cx=x;
 // Flavor quirks before landing.
 if(cur[0]==="cheese")cx+=(Math.random()-.5)*15;
 if(cur[0]==="blueberry")cx+=(Math.random()-.5)*11;
 cx=Math.max(PW/2,Math.min(box.clientWidth-PW/2,cx));

 let land=findLanding(cx);
 // Allow ground row freely; above ground needs enough support.
 if(land.y>0 && land.coverage<0.24){return fallMiss("そこ空中や‼️")}

 // If bridging two bagels, reward stability. One-edge support costs stability.
 let supportBonus=land.support.length>=2?8:0;
 let edgePenalty=land.y===0?0:Math.max(0,(0.58-land.coverage)*38);
 let flavorPenalty=cur[3];
 stable=Math.min(100,stable-edgePenalty-flavorPenalty+supportBonus);

 let p={x:cx,y:land.y,type:cur,rot:(Math.random()-.5)*5,el:null};
 let el=document.createElement("img");el.src=cur[1];el.className="piece";
 el.style.left=(cx-PW/2)+"px";el.style.bottom=land.y+"px";
 el.style.transform=`rotate(${p.rot}deg)`;tower.appendChild(el);p.el=el;pieces.push(p);

 let heightBonus=Math.round(land.y/PH)*3;
 score+=cur[2]+heightBonus+(land.support.length>=2?15:0);
 n++;
 if(land.support.length>=2)toast("✨ 2個で支えた！安定！");
 else if(land.y===0)toast("🥯 土台GET");
 else if(cur[0]==="cheese")toast("🧀 ツルッ…");
 else if(cur[0]==="blueberry")toast("🫐 ボヨンッ");
 else if(cur[0]==="rare")toast("✨ 激レア！");
 update();

 if(stable<=0)return setTimeout(()=>collapse("欲張りすぎやーー‼️"),180);
 cur=null;
 autoScale();
 setTimeout(prep,180);
}
function autoScale(){
 let maxTop=pieces.reduce((m,p)=>Math.max(m,p.y+PH),0);
 let scale=maxTop>330?Math.max(.68,330/maxTop):1;
 tower.style.transformOrigin="50% 100%";
 tower.style.transform=`scale(${scale})`;
}
function fallMiss(reason){
 if(!cur)return;
 let ghost=document.createElement("img");ghost.src=cur[1];ghost.className="piece";
 ghost.style.left=(x-PW/2)+"px";ghost.style.top="48px";ghost.style.zIndex=25;tower.appendChild(ghost);
 ghost.style.transition="top .55s ease-in,transform .55s,opacity .7s";
 requestAnimationFrame(()=>{ghost.style.top=(box.clientHeight-120)+"px";ghost.style.transform="rotate(130deg)";ghost.style.opacity=".2"});
 cur=null;stable-=14;update();toast(reason);
 setTimeout(()=>{ghost.remove();if(stable<=0)collapse("落としすぎや‼️");else prep()},650);
}
function collapse(reason){
 if(!play)return;play=false;cur=null;
 pieces.forEach((p,i)=>{p.el.style.transition="all .7s ease";p.el.style.transform=`translate(${(i%2?1:-1)*(65+i*4)}px,100px) rotate(${(i%2?1:-1)*(45+i*5)}deg)`;p.el.style.opacity=".25"});
 $("#bubble").textContent="あーーーー‼️";
 setTimeout(()=>finish(reason),730);
}
function finish(reason){
 $("#final").textContent=score;let m,img="./umeko_stack_shake.PNG",title="崩壊💥";
 if(score<400)m="ピラミッド以前の問題や。";
 else if(score<800)m="土台は見えてきた。まだ帰れん。";
 else if(score<1400)m="お、積み方わかってきたやん。";
 else if(score<2200){m="かなり積んだ。今日は認めたる。";img="./umeko_stack.PNG";title="生還🥯"}
 else{m="もうパン屋の陳列棚や。";img="./umeko_stack.PNG";title="積み職人👑"}
 $("#rtitle").textContent=title;$("#rimg").src=img;$("#msg").innerHTML=reason+"<br>"+m;screen("result");
 $("#retry").disabled=true;setTimeout(()=>$("#retry").disabled=false,1000);
}
function move(d){if(play&&cur)setX(x+d*18)}
$("#left").onpointerdown=e=>{e.preventDefault();move(-1);clearInterval(timer);timer=setInterval(()=>move(-1),70)};
$("#right").onpointerdown=e=>{e.preventDefault();move(1);clearInterval(timer);timer=setInterval(()=>move(1),70)};
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>clearInterval(timer)));
$("#drop").onpointerdown=e=>{e.preventDefault();drop()};
$("#startBtn").onclick=start;$("#retry").onclick=()=>{if(!$("#retry").disabled)start()};
})();
</script></body></html>
